
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVA AI</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>✦ NOVA AI</h1>
      <p>Your AI assistant</p>
    </header>

    <main id="chat">
      <div class="message bot">
        Hello! Welcome to NOVA AI. How can I help you?
      </div>
    </main>

    <form id="chat-form">
      <input id="message" type="text"
        placeholder="Ask NOVA anything..." required>
      <button type="submit">Send</button>
    </form>
  </div>

  <script src="/app.js"></script>
</body>
</html>
